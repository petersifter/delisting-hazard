[project]
name = "delisting"
version = "0.1.0"
description = "Competing-risks hazard model of US equity delisting on CRSP and Compustat"
readme = "README.md"
authors = [
    { name = "Peter Sifter", email = "petersifter@uchicago.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "lifelines>=0.30.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
    "statsmodels>=0.14.6",
    "wrds>=3.1.6",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "PD", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
